# API: ECR → ECS.
# Frontend: Vercel (see frontend/vercel.json).
#
# GitHub: Secret AWS_ROLE_ARN + vars below. Optional: ALB_BASE_URL for post-deploy curl.
# Vars pasted with trailing Enter/CR break image tags — we strip \r\n in "Sanitize" step.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy-api:
    name: Deploy API (ECR → ECS)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # GitHub "Repository variables" often pick up \r\n when copy-pasted from Windows
      - name: Sanitize GitHub vars
        run: |
          trim() { printf '%s' "$1" | tr -d '\r\n'; }
          {
            echo "AWS_ACCOUNT_ID=$(trim "${{ vars.AWS_ACCOUNT_ID }}")"
            echo "AWS_REGION=$(trim "${{ vars.AWS_REGION }}")"
            echo "ECR_REPOSITORY_API=$(trim "${{ vars.ECR_REPOSITORY_API }}")"
            echo "ECS_CLUSTER=$(trim "${{ vars.ECS_CLUSTER }}")"
            echo "ECS_SERVICE_API=$(trim "${{ vars.ECS_SERVICE_API }}")"
            echo "ECS_TASK_FAMILY=$(trim "${{ vars.ECS_TASK_FAMILY }}")"
            echo "CONTAINER_NAME=$(trim "${{ vars.CONTAINER_NAME }}")"
            echo "ALB_BASE_URL=$(trim "${{ vars.ALB_BASE_URL }}")"
            echo "IMAGE_TAG=${{ github.sha }}"
          } >> "$GITHUB_ENV"
          test -n "$(trim "${{ vars.AWS_ACCOUNT_ID }}")" || { echo "::error::AWS_ACCOUNT_ID is empty"; exit 1; }
          test -n "$(trim "${{ vars.AWS_REGION }}")" || { echo "::error::AWS_REGION is empty"; exit 1; }
          test -n "$(trim "${{ vars.ECR_REPOSITORY_API }}")" || { echo "::error::ECR_REPOSITORY_API is empty"; exit 1; }

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image
        working-directory: backend
        run: |
          set -euo pipefail
          ECR_IMAGE="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY_API}:${IMAGE_TAG}"
          echo "Pushing: ${ECR_IMAGE}"
          docker build -t "$ECR_IMAGE" .
          docker push "$ECR_IMAGE"
          ECR_REPO="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY_API}"
          docker tag "$ECR_IMAGE" "${ECR_REPO}:latest"
          docker push "${ECR_REPO}:latest"

      - name: Render task definition with new image
        id: render
        run: |
          set -euo pipefail
          FAMILY="${ECS_TASK_FAMILY}"
          CNAME="${CONTAINER_NAME}"
          ACCOUNT="${AWS_ACCOUNT_ID}"
          REGION="${AWS_REGION}"
          REPO="${ECR_REPOSITORY_API}"
          TAG="${IMAGE_TAG}"

          test -n "$FAMILY" || { echo "::error::ECS_TASK_FAMILY is empty"; exit 1; }
          test -n "$CNAME" || { echo "::error::CONTAINER_NAME is empty"; exit 1; }

          IMG="${ACCOUNT}.dkr.ecr.${REGION}.amazonaws.com/${REPO}:${TAG}"

          aws ecs describe-task-definition \
            --task-definition "${FAMILY}" \
            --query taskDefinition \
            --output json > raw.json

          jq --arg IMG "$IMG" --arg CN "$CNAME" '
            del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy,.deregisteredAt) |
            .containerDefinitions |= map(if .name == $CN then .image = $IMG else . end)
          ' raw.json > task-definition.json

      - name: Deploy to ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: task-definition.json
          service: ${{ env.ECS_SERVICE_API }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Smoke test ALB /health
        if: ${{ env.ALB_BASE_URL != '' }}
        run: |
          set -euo pipefail
          curl -sfS "${ALB_BASE_URL}/health" | jq -e '.status == "ok"' >/dev/null
          echo "ALB smoke test OK"
