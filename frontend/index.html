<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tag Checker</title>
    <style>
      * { box-sizing: border-box; }
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f1419;
        color: #e6edf3;
      }
      .card {
        padding: 2rem;
        border-radius: 12px;
        border: 1px solid #30363d;
        max-width: 28rem;
        text-align: center;
      }
      .status { margin-top: 1rem; font-family: ui-monospace, monospace; font-size: 0.82rem; word-break: break-all; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Tag Checker</h1>
      <p id="hint">
        Deploy on Vercel. Set env <code>VITE_API_URL</code> to your API base URL
        (HTTPS → HTTP may be blocked — use HTTPS on the API for production).
      </p>
      <p id="api-status" class="status" aria-live="polite"></p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
